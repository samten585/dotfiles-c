[config]

[config.wallpaper]
set = true
command = "swww img --transition-type center {{ image }}"

[templates.waybar]
input_path = '/home/samer/.config/matugen/templates/colors.css'
output_path = '~/.config/waybar/colors.css'
post_hook = 'pkill -SIGUSR2 waybar'

[templates.wlogout]
input_path = '/home/samer/.config/matugen/templates/colors.css'
output_path = '~/.config/wlogout/colors.css'

[templates.hyprland]
input_path = '/home/samer/.config/matugen/templates/hyprland-colors.conf'
output_path = '~/.config/hypr/colors.conf'
post_hook = 'hyprctl reload'

[templates.alacritty]
input_path = '/home/samer/.config/matugen/templates/alacritty.toml'
output_path = '~/.config/alacritty/colors.toml'

[templates.kitty]
input_path = '/home/samer/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/kitty/themes/Matugen.conf'
post_hook = "kitty +kitten themes --reload-in=all Matugen"

[templates.test]
input_path = "~/.config/matugen/templates/test.txt"
output_path = "~/test-matugen.txt"


