<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Turbo Type</title>
  <style>
    * {
      border-radius: 0;
      border: 0;
      padding: 0px;
      margin: 0px;
      user-select: none;
      -webkit-user-select: none;
      font-family: Roboto, Helvetica, Arial;
    }

    ::before {
      border: 0;
      margin: 0;
      padding: 0;
      font-family: Roboto, Helvetica, Arial;
    }

    ::after {
      border: 0;
      margin: 0;
      padding: 0;
      font-family: Roboto, Helvetica, Arial;
    }

    html, body, #turbotype-root {
      width: 350px;
      height: 600px;
      max-width: 512px;
    }

    .dialog-btn-main {
      background: #6D94F6 !important;
      color: #FFF !important;
      font-weight: 500 !important;
      transition-duration: 0.3s !important;
      transition-property: background-color !important;
    }

    .dialog-btn-main:hover {
      background: rgba(109, 148, 246, 0.8) !important;
    }

    .dialog-btn-secondary {
      background: transparent !important;
      border: 1px solid #6D94F6 !important;
      color: #6D94F6 !important;
      transition-property: background-color !important;
      transition-duration: 0.3s !important;
    }

    .dialog-btn-secondary:hover {
      background: #6D94F6 !important;
      color: #FFF !important;
    }

    #react-confirm-alert-firm-svg {
      z-index: 1501!important;
    }

    .turbotype-dialog-overlay {
      font-family: Roboto, Helvetica, Arial;
      z-index: 1502!important;
    }

    .turbotype-dialog-overlay .react-confirm-alert-body {
      width: 80% !important;
      font-size: 15px!important;
      margin: 0 auto!important;
      font-family: Roboto, Helvetica, Arial!important;
    }

    .turbotype-dialog-overlay .react-confirm-alert-body > h1 {
      font-size: 20px!important;
      font-family: Roboto, Helvetica, Arial!important;
      margin-bottom: 10px!important;
    }

    .turbotype-dialog-overlay .react-confirm-alert-body > p {
      margin: 10px 0!important;
    }

    .turbotype-dialog-overlay .react-confirm-alert-body button {
      font-size: 16px!important;
      padding: 10px 20px;
    }

    .MuiTooltip-tooltip {
      background-color:rgba(30, 30, 30, 0.9) !important;
      font-family: Roboto, Helvetica, Arial !important;
      font-size: 14px!important;
      font-weight: 300!important;
      line-height: 20px!important;
    }

    .MuiTooltip-arrow::before {
      background-color:rgba(30, 30, 30, 0.9) !important;
    }

    .MuiSnackbar-anchorOriginTopCenter {
      top: 10px !important;
      width: 80% !important;
      margin: 0 auto;
    }

    .MuiChartsTooltip-root {
      background-color: rgba(30, 30, 30, 0.9) !important;
      font-size: 12px;
      border: 0;
    }

    .MuiChartsTooltip-root td {
      padding-top: 3px !important;
      padding-bottom: 3px !important;
    }

    .MuiChartsTooltip-root thead tr td {
      border-bottom: 1px solid rgba(90, 90, 90, 0.5);
    }

    .MuiChartsTooltip-root td p {
      color: #FFF !important;
      font-size: 12px !important;
    }

    .tag-light {
      color: #d2e8fc !important;
      cursor: pointer !important;
      margin-right: 3px !important;
      text-decoration: none !important;
      display: inline-block !important;
    }

    .tag-light:hover {
      color: #d2e8fc !important;
      text-decoration: underline !important;
    }
  </style>
</head>
<body>
  <div id="turbotype-root"></div>
  <script charset="utf-8" src="js/sidebar.js"></script>
</body>
</html>
